<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manu Cam -> OBS</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        .ui-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border: 1px solid #28a745;
            position: relative;
            z-index: 10;
        }
        h2 { margin-top: 0; color: #28a745; }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
        }
        .copy-box {
            display: flex;
            margin-top: 15px;
            gap: 5px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 5px;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #a9ffb7;
            font-family: monospace;
            padding: 10px;
            flex: 1;
            font-size: 13px;
            outline: none;
        }
        .btn-copy {
            background: #007bff;
            font-size: 14px;
            padding: 10px 15px;
            width: auto;
            border-radius: 5px;
            margin-top: 0;
        }
        .btn-copy.success { background: #28a745; }
        
        /* Vollbild-Stream für OBS */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            background: black;
        }
        
        /* NEU: Zoom-Steuerung direkt in OBS unten eingeblendet */
        .obs-zoom-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #28a745;
            pointer-events: auto; /* Macht es in OBS klickbar */
        }
        .zoom-slider {
            width: 150px;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <iframe id="ninja-stream" class="hidden" allow="camera;microphone;autoplay;fullscreen"></iframe>

    <div id="obs-controls" class="obs-zoom-bar hidden">
        <span style="font-size: 14px; font-weight: bold; white-space: nowrap;">🔍 Zoom:</span>
        <input type="range" id="zoom-range" class="zoom-slider" min="1" max="4" step="0.1" value="1" oninput="applyObsZoom(this.value)">
        <span id="zoom-val" style="font-family: monospace; min-width: 35px; text-align: left;">1.0x</span>
    </div>

    <div id="ui" class="ui-container">
        <h2>📱 Manu Cam -> OBS</h2>
        <p>Erstelle eine direkte, stabile Kameraverbindung ohne Blackscreen-Fehler.</p>
        
        <div id="setup-area">
            <button onclick="startHandyStream()">Kamera-Stream starten</button>
        </div>
        
        <div id="sender-info" class="hidden">
            <p><strong>✓ Stream aktiv!</strong> Erlaube ggf. den Kamerazugriff im Browser.</p>
            <p style="font-size: 14px; color: #bbb;">Kopiere den Link und füge ihn in OBS ein:</p>
            
            <div class="copy-box">
                <input type="text" id="obs-link-input" readonly onclick="this.select();">
                <button id="btn-copy" class="btn-copy" onclick="copyToClipboard()">Kopieren</button>
            </div>
        </div>
    </div>

    <script>
        const uiContainer = document.getElementById('ui');
        const setupArea = document.getElementById('setup-area');
        const senderInfo = document.getElementById('sender-info');
        const obsLinkInput = document.getElementById('obs-link-input');
        const btnCopy = document.getElementById('btn-copy');
        const iframe = document.getElementById('ninja-stream');
        const obsControls = document.getElementById('obs-controls');
        const zoomVal = document.getElementById('zoom-val');

        const urlParams = new URLSearchParams(window.location.search);
        const viewId = urlParams.get('view');

        // --- OBS MODUS (WENN EIN EMPFÄNGER-LINK GEÖFFNET WIRD) ---
        if (viewId) {
            uiContainer.classList.add('hidden');
            iframe.classList.remove('hidden');
            obsControls.classList.remove('hidden'); // Zoom-Leiste einblenden
            
            // Direkte VDO.ninja-Verbindung für OBS laden. &control=1 erlaubt das Steuern des Zooms
            iframe.src = `https://vdo.ninja/?view=${viewId}&cleanhide=1&autoplay=1&transparent=1&control=1`;
        }

        // --- HANDY MODUS (SENDER) ---
        function startHandyStream() {
            setupArea.classList.add('hidden');
            senderInfo.classList.remove('hidden');

            // Zufälligen Raum-Namen erstellen
            const streamSecret = "manu-" + Math.random().toString(36).substring(2, 11);
            
            // Link generieren, den du in OBS einfügst
            const currentUrl = window.location.href.split('?')[0];
            obsLinkInput.value = `${currentUrl}?view=${streamSecret}`;

            // Auf dem Handy leiten wir DIREKT auf VDO.ninja weiter. 
            // Das umgeht alle Iframe-Sperren der Kamera unter iOS/Safari komplett!
            setTimeout(() => {
                window.location.href = `https://vdo.ninja/?push=${streamSecret}&facing=environment&v=1&a=1&transparent=1&quality=0&control=1`;
            }, 1500);
        }

        // Zoom-Befehl direkt im OBS-Fenster ausführen
        function applyObsZoom(value) {
            zoomVal.innerText = parseFloat(value).toFixed(1) + "x";
            if (iframe.contentWindow) {
                // Sendet den Zoom-Wert direkt an das Video-Fenster in OBS
                iframe.contentWindow.postMessage(JSON.stringify({ "zoom": parseFloat(value) }), '*');
            }
        }

        function copyToClipboard() {
            obsLinkInput.select();
            obsLinkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(obsLinkInput.value).then(() => {
                btnCopy.innerText = "Kopiert! ✓";
                btnCopy.classList.add('success');
            }).catch(() => alert("Kopieren fehlgeschlagen."));
        }
    </script>
</body>
</html>
