<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Handy Kamera & Audio zu OBS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: transparent;
        }
        .ui-container {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 50px;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #218838; }
        
        .controls-container {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            gap: 10px;
        }
        .btn-control {
            background: #007bff;
            font-size: 14px;
            padding: 10px 15px;
            flex: 1;
        }
        .btn-control:hover { background: #0056b3; }
        .btn-muted { background: #dc3545 !important; }
        .btn-muted:hover { background: #bd2130 !important; }

        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 15px;
            width: 100%;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        #obs-link {
            background: #222;
            padding: 15px;
            word-break: break-all;
            border: 2px dashed #28a745;
            margin-top: 15px;
            user-select: all;
            font-family: monospace;
            font-size: 14px;
            border-radius: 5px;
            color: #a9ffb7;
        }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline></video>

    <div id="ui" class="ui-container">
        <h2>📱 Handy-Kamera -> OBS</h2>
        <p>Erstelle einen privaten Stream-Link inklusive Ton und Steuerung.</p>
        <button id="btn-sender" onclick="initSender()">Stream starten</button>
        
        <div id="sender-info" class="hidden">
            <label for="camera-select" style="display:block; text-align:left; margin-top:10px;">🎥 Kamera wechseln:</label>
            <select id="camera-select" onchange="switchCamera(this.value)">
                <option value="">Lade Kameras...</option>
            </select>

            <div class="controls-container">
                <button id="btn-mute-cam" class="btn-control" onclick="toggleCamera()">📷 Cam Aus</button>
                <button id="btn-mute-audio" class="btn-control" onclick="toggleAudio()">🎤 Mic Aus</button>
            </div>

            <p style="margin-top: 20px;"><strong>✓ Stream aktiv!</strong> Füge diesen Link in OBS ein:</p>
            <div id="obs-link">Generiere Link...</div>
        </div>
    </div>

    <div id="obs-ui" class="ui-container hidden">
        <h2>🔊 Audio aktivieren</h2>
        <p>Klicke auf den Button, um den Ton des Streams freizuschalten.</p>
        <button onclick="unlockAudio()">Ton einschalten</button>
    </div>

    <script>
        const videoElement = document.getElementById('remote-video');
        const uiContainer = document.getElementById('ui');
        const obsUiContainer = document.getElementById('obs-ui');
        const obsLinkLabel = document.getElementById('obs-link');
        const senderInfo = document.getElementById('sender-info');
        const cameraSelect = document.getElementById('camera-select');
        
        const btnMuteCam = document.getElementById('btn-mute-cam');
        const btnMuteAudio = document.getElementById('btn-mute-audio');
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        let localStream = null;
        let currentPeer = null;
        let activeCall = null;
        let uniqueRoomId = "";

        let isCameraActive = true;
        let isAudioActive = true;

        if (roomId) {
            uiContainer.classList.add('hidden');
            if (!navigator.userAgent.includes("OBS")) {
                obsUiContainer.classList.remove('hidden');
            }
            initReceiver(roomId);
        } else {
            videoElement.muted = true;
        }

        function unlockAudio() {
            videoElement.muted = false;
            videoElement.play().catch(e => console.log(e));
            obsUiContainer.classList.add('hidden');
        }

        // --- HANDY MODUS (SENDER) ---
        function initSender() {
            document.getElementById('btn-sender').classList.add('hidden');
            
            // BEHOBEN: Hier fehlte das .random()
            uniqueRoomId = "obs-stream-ctrl-" + Math.random().toString(36).substring(2, 11);
            
            const currentUrl = window.location.href.split('?')[0];
            const obsUrl = `${currentUrl}?room=${uniqueRoomId}`;
            obsLinkLabel.innerText = obsUrl;
            senderInfo.classList.remove('hidden');

            startStream(null);
        }

        function startStream(deviceId) {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            const videoConstraints = {
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            };

            if (deviceId) {
                videoConstraints.deviceId = { exact: deviceId };
            } else {
                videoConstraints.facingMode = "environment";
            }

            navigator.mediaDevices.getUserMedia({
                video: videoConstraints,
                audio: { echoCancellation: true, noiseSuppression: true }
            }).then(stream => {
                localStream = stream;
                videoElement.srcObject = stream;

                localStream.getVideoTracks()[0].enabled = isCameraActive;
                if(localStream.getAudioTracks().length > 0) {
                    localStream.getAudioTracks()[0].enabled = isAudioActive;
                }

                getCameras();

                if (!currentPeer) {
                    currentPeer = new Peer();
                    currentPeer.on('open', () => {
                        currentPeer.on('call', (call) => {
                            activeCall = call;
                            call.answer(localStream);
                        });
                    });

                    setInterval(() => {
                        currentPeer.connect(uniqueRoomId);
                    }, 3000);
                } else if (activeCall && activeCall.peerConnection) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const audioTrack = localStream.getAudioTracks()[0];
                    
                    const videoSender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (videoSender && videoTrack) {
                        videoSender.replaceTrack(videoTrack);
                    }
                    const audioSender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                    if (audioSender && audioTrack) {
                        audioSender.replaceTrack(audioTrack);
                    }
                }

            }).catch(err => {
                alert("Fehler beim Kamerazugriff: " + err);
            });
        }

        function toggleCamera() {
            if (localStream) {
                isCameraActive = !isCameraActive;
                localStream.getVideoTracks()[0].enabled = isCameraActive;
                
                if (isCameraActive) {
                    btnMuteCam.innerText = "📷 Cam Aus";
                    btnMuteCam.classList.remove('btn-muted');
                } else {
                    btnMuteCam.innerText = "📷 Cam An";
                    btnMuteCam.classList.add('btn-muted');
                }
            }
        }

        function toggleAudio() {
            if (localStream && localStream.getAudioTracks().length > 0) {
                isAudioActive = !isAudioActive;
                localStream.getAudioTracks()[0].enabled = isAudioActive;
                
                if (isAudioActive) {
                    btnMuteAudio.innerText = "🎤 Mic Aus";
                    btnMuteAudio.classList.remove('btn-muted');
                } else {
                    btnMuteAudio.innerText = "🎤 Mic An";
                    btnMuteAudio.classList.add('btn-muted');
                }
            }
        }

        function getCameras() {
            navigator.mediaDevices.enumerateDevices()
                .then(devices => {
                    cameraSelect.innerHTML = "";
                    let videoDevices = devices.filter(device => device.kind === 'videoinput');
                    
                    videoDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Kamera ${index + 1}`;
                        
                        if (localStream && localStream.getVideoTracks()[0].getSettings().deviceId === device.deviceId) {
                            option.selected = true;
                        }
                        cameraSelect.appendChild(option);
                    });
                });
        }

        function switchCamera(deviceId) {
            if (deviceId) {
                startStream(deviceId);
            }
        }

        // --- OBS MODUS (EMPFÄNGER) ---
        function initReceiver(targetRoomId) {
            const peer = new Peer(targetRoomId);

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.muted = false;
                    videoElement.play().catch(e => console.log("Autoplay blockiert:", e));
                });
            });
        }
    </script>
</body>
</html>
