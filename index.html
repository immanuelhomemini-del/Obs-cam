<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy Kamera zu OBS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: black;
        }
        .ui-container {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 50px;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .controls-container {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            gap: 10px;
        }
        .btn-control { background: #007bff; font-size: 14px; padding: 10px 15px; flex: 1; }
        .btn-muted { background: #dc3545 !important; }
        
        .copy-box {
            display: flex;
            margin-top: 15px;
            gap: 5px;
            background: #222;
            border: 2px dashed #28a745;
            border-radius: 5px;
            padding: 5px;
        }
        #obs-link-input {
            background: transparent;
            border: none;
            color: #a9ffb7;
            font-family: monospace;
            padding: 10px;
            flex: 1;
            font-size: 14px;
            outline: none;
        }
        .btn-copy {
            background: #007bff;
            font-size: 14px;
            padding: 10px 15px;
            margin-top: 0;
            border-radius: 5px;
            white-space: nowrap;
        }
        .btn-copy.success { background: #28a745; }

        select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 15px;
            width: 100%;
        }
        .hidden { display: none !important; }
        
        /* Hinweistext für OBS */
        #obs-click-hint {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="remote-video" autoplay playsinline muted></video>

    <div id="ui" class="ui-container">
        <h2>📱 Handy-Kamera -> OBS</h2>
        <p>Klicke auf Start, um den Stream-Raum zu eröffnen.</p>
        <button id="btn-sender" onclick="initSender()">Stream starten</button>
        
        <div id="sender-info" class="hidden">
            <label for="camera-select" style="display:block; text-align:left; margin-top:10px;">🎥 Kamera wechseln:</label>
            <select id="camera-select" onchange="switchCamera(this.value)">
                <option value="">Lade Kameras...</option>
            </select>

            <div class="controls-container">
                <button id="btn-mute-cam" class="btn-control" onclick="toggleCamera()">📷 Cam Aus</button>
                <button id="btn-mute-audio" class="btn-control" onclick="toggleAudio()">🎤 Mic Aus</button>
            </div>

            <p style="margin-top: 20px; text-align: left; margin-bottom: 5px;"><strong>✓ Verbindung bereit!</strong></p>
            
            <div class="copy-box">
                <input type="text" id="obs-link-input" readonly onclick="this.select();">
                <button id="btn-copy" class="btn-copy" onclick="copyToClipboard()">Kopieren</button>
            </div>
        </div>
    </div>

    <div id="obs-click-hint" class="hidden" onclick="activateObsStream()">
        <h2>🔴 Live-Stream empfangen</h2>
        <p>Bitte klicke hier mitten ins Fenster, um Bild und Ton zu aktivieren.</p>
    </div>

    <script>
        const videoElement = document.getElementById('remote-video');
        const uiContainer = document.getElementById('ui');
        const obsLinkInput = document.getElementById('obs-link-input');
        const btnCopy = document.getElementById('btn-copy');
        const senderInfo = document.getElementById('sender-info');
        const cameraSelect = document.getElementById('camera-select');
        const btnMuteCam = document.getElementById('btn-mute-cam');
        const btnMuteAudio = document.getElementById('btn-mute-audio');
        const obsClickHint = document.getElementById('obs-click-hint');
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        let localStream = null;
        let peer = null;
        let currentCall = null;
        let isCameraActive = true;
        let isAudioActive = true;

        if (roomId) {
            // Wir sind in OBS
            uiContainer.classList.add('hidden');
            obsClickHint.classList.remove('hidden'); // Zeige den Klick-Hinweis
            initReceiver(roomId);
        }

        function activateObsStream() {
            videoElement.muted = false; // Ton einschalten
            videoElement.play().then(() => {
                obsClickHint.classList.add('hidden'); // Hinweis ausblenden, wenn es läuft
            }).catch(e => console.log("Play-Fehler:", e));
        }

        // --- HANDY MODUS ---
        function initSender() {
            document.getElementById('btn-sender').classList.add('hidden');
            
            const targetRoomId = "room-" + Math.random().toString(36).substring(2, 11).toLowerCase();
            const currentUrl = window.location.href.split('?')[0];
            
            obsLinkInput.value = `${currentUrl}?room=${targetRoomId}`;
            senderInfo.classList.remove('hidden');

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true
            }).then(stream => {
                localStream = stream;
                videoElement.srcObject = stream;
                getCameras();

                peer = new Peer();
                peer.on('open', () => {
                    const callInterval = setInterval(() => {
                        if (peer && !peer.destroyed) {
                            const call = peer.call(targetRoomId, localStream);
                            call.on('stream', () => {
                                clearInterval(callInterval);
                                currentCall = call;
                            });
                        }
                    }, 2500);
                });

            }).catch(err => alert("Kamera-Fehler: " + err));
        }

        function copyToClipboard() {
            obsLinkInput.select();
            obsLinkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(obsLinkInput.value).then(() => {
                btnCopy.innerText = "Kopiert! ✓";
                btnCopy.classList.add('success');
                setTimeout(() => {
                    btnCopy.innerText = "Kopieren";
                    btnCopy.classList.remove('success');
                }, 2000);
            }).catch(err => alert("Fehler beim Kopieren: " + err));
        }

        function switchCamera(deviceId) {
            if (!localStream) return;
            localStream.getTracks().forEach(track => track.stop());

            navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true
            }).then(newStream => {
                localStream = newStream;
                videoElement.srcObject = newStream;

                localStream.getVideoTracks()[0].enabled = isCameraActive;
                localStream.getAudioTracks()[0].enabled = isAudioActive;

                if (currentCall && currentCall.peerConnection) {
                    const videoSender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (videoSender) videoSender.replaceTrack(newStream.getVideoTracks()[0]);
                    
                    const audioSender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                    if (audioSender) audioSender.replaceTrack(newStream.getAudioTracks()[0]);
                }
            });
        }

        function getCameras() {
            navigator.mediaDevices.enumerateDevices().then(devices => {
                cameraSelect.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Kamera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
            });
        }

        function toggleCamera() {
            isCameraActive = !isCameraActive;
            localStream.getVideoTracks()[0].enabled = isCameraActive;
            btnMuteCam.innerText = isCameraActive ? "📷 Cam Aus" : "📷 Cam An";
            btnMuteCam.classList.toggle('btn-muted', !isCameraActive);
        }

        function toggleAudio() {
            isAudioActive = !isAudioActive;
            localStream.getAudioTracks()[0].enabled = isAudioActive;
            btnMuteAudio.innerText = isAudioActive ? "🎤 Mic Aus" : "🎤 Mic An";
            btnMuteAudio.classList.toggle('btn-muted', !isAudioActive);
        }

        // --- OBS MODUS ---
        function initReceiver(targetRoomId) {
            peer = new Peer(targetRoomId);
            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    
                    // Versuche das Video direkt abzuspielen
                    videoElement.play().then(() => {
                        // Wenn Autoplay klappt, blende den Hinweis direkt aus
                        obsClickHint.classList.add('hidden');
                    }).catch(e => {
                        console.log("Autoplay blockiert, Klick erforderlich.");
                    });
                });
            });
        }
    </script>
</body>
</html>
