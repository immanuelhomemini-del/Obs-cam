<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manu Cam -> OBS (Powered by VDO.ninja)</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        .ui-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border: 1px solid #28a745;
        }
        h2 { margin-top: 0; color: #28a745; }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #218838; }
        
        .copy-box {
            display: flex;
            margin-top: 15px;
            gap: 5px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 5px;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #a9ffb7;
            font-family: monospace;
            padding: 10px;
            flex: 1;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .btn-copy {
            background: #007bff;
            font-size: 14px;
            padding: 10px 15px;
            margin-top: 0;
            border-radius: 5px;
            width: auto;
        }
        .btn-copy.success { background: #28a745; }
        
        /* NEU: Styling für den Zoom-Bereich */
        .zoom-container {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #444;
        }
        .zoom-label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .zoom-slider {
            width: 100%;
            -webkit-appearance: none;
            background: #444;
            height: 8px;
            border-radius: 5px;
            outline: none;
        }
        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: #28a745;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            background: black;
        }
        .hidden { display: none !important; }
        .setup-step {
            text-align: left;
            background: #222;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>

    <iframe id="ninja-stream" class="hidden" allow="camera;microphone;autoplay;fullscreen"></iframe>

    <div id="ui" class="ui-container">
        <h2>📱 Manu Cam -> OBS</h2>
        <p>Nutzt die ultraschnelle, stabile Verbindung von VDO.ninja direkt auf deiner Website.</p>
        
        <div id="setup-area">
            <button onclick="startCamStream()">Kamera-Stream starten</button>
        </div>
        
        <div id="sender-info" class="hidden">
            <div class="setup-step">
                <strong>Schritt 1:</strong> Erlaube oben den Zugriff auf deine Kamera.
            </div>

            <div class="zoom-container">
                <div class="zoom-label">
                    <span>🔍 Kamera-Zoom</span>
                    <span id="zoom-val">1.0x</span>
                </div>
                <input type="range" id="zoom-range" class="zoom-slider" min="1" max="4" step="0.1" value="1" oninput="updateZoom(this.value)">
            </div>

            <div class="setup-step">
                <strong>Schritt 2:</strong> Kopiere den unteren Link und füge ihn am PC in OBS als Browserquelle ein.
            </div>

            <div class="copy-box">
                <input type="text" id="obs-link-input" readonly onclick="this.select();">
                <button id="btn-copy" class="btn-copy" onclick="copyToClipboard()">Kopieren</button>
            </div>
        </div>
    </div>

    <script>
        const uiContainer = document.getElementById('ui');
        const setupArea = document.getElementById('setup-area');
        const senderInfo = document.getElementById('sender-info');
        const obsLinkInput = document.getElementById('obs-link-input');
        const btnCopy = document.getElementById('btn-copy');
        const iframe = document.getElementById('ninja-stream');
        const zoomVal = document.getElementById('zoom-val');

        const urlParams = new URLSearchParams(window.location.search);
        const viewId = urlParams.get('view');

        // --- OBS MODUS ---
        if (viewId) {
            uiContainer.classList.add('hidden');
            iframe.classList.remove('hidden');
            // &control=1 erlaubt es dem Handy, Steuerungsbefehle wie Zoom an OBS zu senden
            iframe.src = `https://vdo.ninja/?view=${viewId}&cleanhide=1&autoplay=1&transparent=1&control=1`;
        }

        // --- HANDY MODUS ---
        function startCamStream() {
            setupArea.classList.add('hidden');
            senderInfo.classList.remove('hidden');

            const streamSecret = "manu-stream-" + Math.random().toString(36).substring(2, 11);
            const currentUrl = window.location.href.split('?')[0];
            obsLinkInput.value = `${currentUrl}?view=${streamSecret}`;

            iframe.classList.remove('hidden');
            iframe.style.position = "relative";
            iframe.style.width = "100%";
            iframe.style.height = "220px"; 
            iframe.style.marginTop = "15px";
            iframe.style.borderRadius = "8px";
            iframe.style.border = "1px solid #444";
            
            // &control=1 wird auch beim Sender hinzugefügt, damit das Handy Befehle senden darf
            iframe.src = `https://vdo.ninja/?push=${streamSecret}&facing=environment&v=1&a=1&transparent=1&quality=0&control=1`;
        }

        // NEU: Zoom-Funktion an das VDO.ninja Iframe übertragen
        function updateZoom(value) {
            zoomVal.innerText = parseFloat(value).toFixed(1) + "x";
            
            if (iframe.contentWindow) {
                // Sendet den Zoom-Befehl direkt in die VDO.ninja-Engine
                iframe.contentWindow.postMessage(JSON.stringify({ "zoom": parseFloat(value) }), '*');
            }
        }

        function copyToClipboard() {
            obsLinkInput.select();
            obsLinkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(obsLinkInput.value).then(() => {
                btnCopy.innerText = "Kopiert! ✓";
                btnCopy.classList.add('success');
                setTimeout(() => {
                    btnCopy.innerText = "Kopieren";
                    btnCopy.classList.remove('success');
                }, 2000);
            }).catch(err => alert("Kopieren fehlgeschlagen."));
        }
    </script>
</body>
</html>
